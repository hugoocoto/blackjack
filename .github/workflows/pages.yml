# Builds the web version and publishes it on GitHub Pages. Runs for each
# release tag (so the site plays the latest release), or by hand.
#
# Needs Pages turned on once: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Build
        run: cargo build --release --locked --target wasm32-unknown-unknown

      # The page needs the JavaScript loaders of the exact miniquad and
      # quad-snd versions the game was built with.
      - name: Assemble the site
        run: |
          version() { grep -A1 "^name = \"$1\"$" Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p'; }
          src=$(echo "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/)
          mkdir site
          cp web/index.html assets/icon/hushjack.png site/
          cp target/wasm32-unknown-unknown/release/hushjack.wasm site/
          cp "$src/miniquad-$(version miniquad)/js/gl.js" site/
          cp "$src/quad-snd-$(version quad-snd)/js/audio.js" site/
          ls -l site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
