# Builds the game for Linux, Windows and macOS. Pushing a tag like v0.1.0
# publishes the builds as a GitHub release, publishes the crate to crates.io
# and pushes the builds to itch.io; running it by hand only builds them
# (download from the run's artifacts).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary needs an old glibc and
          # runs on most distros.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          targets=""
          if [ "${{ runner.os }}" = macOS ]; then
            targets="--target aarch64-apple-darwin --target x86_64-apple-darwin"
          fi
          rustup toolchain install stable --profile minimal $targets
          rustup default stable

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Build (Linux, Windows)
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      # One binary for both Apple Silicon and Intel Macs.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/hushjack \
            target/aarch64-apple-darwin/release/hushjack \
            target/x86_64-apple-darwin/release/hushjack

      - name: Package
        shell: bash
        run: |
          dir="hushjack-${{ matrix.name }}"
          mkdir "$dir"
          cp README.md LICENSE "$dir/"
          cp -r assets/licenses "$dir/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/hushjack.exe "$dir/"
            7z a "$dir.zip" "$dir"
          else
            cp target/release/hushjack "$dir/"
            if [ "${{ runner.os }}" = Linux ]; then
              cp packaging/linux/install.sh "$dir/"
            fi
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hushjack-${{ matrix.name }}
          path: hushjack-${{ matrix.name }}.*

  # The Android APK, built with cargo quad-apk in its Docker image (Android
  # SDK and NDK included). Its Rust is older than the game needs, so it's
  # updated first. The APK is signed with a debug key: fine to install by hand.
  android:
    runs-on: ubuntu-latest
    container: notfl3/cargo-apk
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android

      - name: Build
        run: |
          cargo quad-apk build --release
          cp target/android-artifacts/release/apk/hushjack.apk hushjack-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hushjack-android
          path: hushjack-android.apk

  # A failed Android build doesn't hold back the desktop release.
  release:
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.build.result == 'success'
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" hushjack-* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes

  # Needs trusted publishing set up on crates.io (crate settings → Trusted
  # Publishing → GitHub: hugoocoto/blackjack, workflow release.yml), so no
  # token is stored here.
  crates-io:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # cargo publish builds the crate before uploading it.
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  # Pushes each build to its own itch.io channel with butler. Runs only when
  # the repository variable ITCH_TARGET (e.g. "user/hushjack") and the secret
  # BUTLER_API_KEY are set.
  itch:
    if: startsWith(github.ref, 'refs/tags/') && vars.ITCH_TARGET != '' && !cancelled() && needs.build.result == 'success'
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          # Push the unpacked folders, so the itch app can patch updates.
          tar xzf hushjack-linux-x86_64.tar.gz
          tar xzf hushjack-macos-universal.tar.gz
          unzip -q hushjack-windows-x86_64.zip
          for channel in linux:linux-x86_64 windows:windows-x86_64 osx:macos-universal; do
            butler/butler push "hushjack-${channel#*:}" \
              "${{ vars.ITCH_TARGET }}:${channel%%:*}" --userversion "$version"
          done
          if [ -f hushjack-android.apk ]; then
            butler/butler push hushjack-android.apk "${{ vars.ITCH_TARGET }}:android" --userversion "$version"
          fi
