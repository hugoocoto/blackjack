# Builds the game for Linux, Windows and macOS. Pushing a tag like v0.1.0
# publishes the builds as a GitHub release; running it by hand only builds
# them (download from the run's artifacts).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary needs an old glibc and
          # runs on most distros.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          targets=""
          if [ "${{ runner.os }}" = macOS ]; then
            targets="--target aarch64-apple-darwin --target x86_64-apple-darwin"
          fi
          rustup toolchain install stable --profile minimal $targets
          rustup default stable

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Build (Linux, Windows)
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      # One binary for both Apple Silicon and Intel Macs.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/blackjack \
            target/aarch64-apple-darwin/release/blackjack \
            target/x86_64-apple-darwin/release/blackjack

      - name: Package
        shell: bash
        run: |
          dir="blackjack-${{ matrix.name }}"
          mkdir "$dir"
          cp README.md LICENSE "$dir/"
          cp -r assets/licenses "$dir/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/blackjack.exe "$dir/"
            7z a "$dir.zip" "$dir"
          else
            cp target/release/blackjack "$dir/"
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: blackjack-${{ matrix.name }}
          path: blackjack-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" blackjack-* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
