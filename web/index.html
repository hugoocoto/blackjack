<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hushjack</title>
  <link rel="icon" href="hushjack.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a080e; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <!-- gl.js and audio.js come from the miniquad and quad-snd crates the game
       was built with (see .github/workflows/pages.yml). -->
  <script src="gl.js"></script>
  <script src="audio.js"></script>
  <script>
    // Where the game keeps its records and card back (see src/save.rs). The
    // storage can be missing or blocked; then nothing is kept.
    miniquad_add_plugin({
      register_plugin: function (importObject) {
        const bytes = (ptr, len) => new Uint8Array(wasm_memory.buffer, ptr, len);
        const text = (ptr, len) => new TextDecoder().decode(bytes(ptr, len));
        const get = (key) => {
          try { return localStorage.getItem("hushjack/" + key); } catch (e) { return null; }
        };
        importObject.env.hj_storage_len = function (key, key_len) {
          const value = get(text(key, key_len));
          return value === null ? -1 : new TextEncoder().encode(value).length;
        };
        importObject.env.hj_storage_read = function (key, key_len, buf) {
          const value = new TextEncoder().encode(get(text(key, key_len)) || "");
          bytes(buf, value.length).set(value);
        };
        importObject.env.hj_storage_write = function (key, key_len, value, value_len) {
          try { localStorage.setItem("hushjack/" + text(key, key_len), text(value, value_len)); } catch (e) {}
        };
      },
    });
    load("hushjack.wasm");
  </script>
</body>
</html>
