[package]
name = "hushjack"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "A calm pixel-art blackjack table: a hand-shuffled 6-deck shoe, cutting, splitting and a strategy chart"
repository = "https://github.com/hugoocoto/blackjack"
readme = "README.md"
keywords = ["blackjack", "game", "cards", "casino", "pixel-art"]
categories = ["games"]
# Only what the build embeds (assets/), plus the README and licenses.
include = ["/src", "/assets/cards.png", "/assets/font.ttf", "/assets/sfx", "/assets/icon/window-*.rgba", "/assets/icon/hushjack.svg", "/assets/icon/hushjack.png", "/packaging/linux/hushjack.desktop", "/assets/licenses", "/README.md", "/LICENSE"]

[dependencies]
fontdue = "0.9.5"
macroquad = { version = "0.4.16", features = ["audio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep debug builds playable: optimize dependencies.
[profile.dev.package."*"]
opt-level = 3

# Android build (cargo quad-apk, see .github/workflows/android.yml).
[package.metadata.android]
package_name = "io.github.hugoocoto.hushjack"
label = "Hushjack"
res = "packaging/android/res"
icon = "@mipmap/ic_launcher"
fullscreen = true
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userLandscape"
