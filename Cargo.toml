[package]
name = "hushjack"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
fontdue = "0.9.5"
macroquad = { version = "0.4.16", features = ["audio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep debug builds playable: optimize dependencies.
[profile.dev.package."*"]
opt-level = 3
